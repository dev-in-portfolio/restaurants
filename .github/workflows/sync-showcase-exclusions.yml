name: Sync Showcase exclusions

on:
  push:
    paths:
      - '.housekeeping-showcase-sync'

permissions:
  contents: write

concurrency:
  group: sync-showcase-exclusions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconcile audited queue against Showcase
        run: node scripts/sync-showcase-exclusions.mjs

      - name: Commit cleaned queue and guardrails
        run: |
          git config user.name 'restaurant-demo-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            queue/audit-ab-master.json \
            queue/a-yes-1.js \
            queue/a-yes-2.js \
            queue/b-yes.js \
            queue/b-conditional.js \
            queue/showcase-exclusions.json \
            queue/meta.js \
            README.md STATUS.md PORTAL_AUDIT.md index.html portal.js
          git diff --cached --quiet && exit 0
          git commit -m 'chore: reconcile Gemini queue against Restaurant Showcase [skip ci]'
          git push origin main
